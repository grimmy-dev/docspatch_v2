[project]
name = "docspatch"
version = "0.1.0"
description = "AI-powered documentation generation for Python projects"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{name = "grimmy_dev", email = "grimmy024@gmail.com"}]
keywords = ["documentation", "docstring", "readme", "ai", "llm", "cli", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.15",
    "rich>=13",
    "langchain-anthropic>=1.4.3",
    "langchain-openai>=1.2.1",
    "langchain-google-genai>=4.2.2",
    "questionary>=2.1.1",
    "tomli-w>=1.2.0",
    "libcst>=1.8.6",
    "pathspec>=1.1.1",
    "langgraph>=1.2.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
]

[project.urls]
Homepage = "https://github.com/grimmy-dev/docspatch_v2"
Repository = "https://github.com/grimmy-dev/docspatch_v2.git"
Issues = "https://github.com/grimmy-dev/docspatch_v2/issues"

[project.scripts]
dp = "docspatch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docspatch"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-asyncio>=1",
    "mypy>=2.1.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src"]
target-version = "py314"
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []
